    <!-- ⚡ TShare Lifecycle Auto-Shutdown on Webpage Close -->
    <script>
      (function() {
        var tabId = 'tab_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36);
        var es = null;
        function connectSSE() {
          try {
            es = new EventSource('/api/lifecycle/stream?tabId=' + encodeURIComponent(tabId));
            es.onerror = function() {
              if (es) { es.close(); es = null; }
              setTimeout(connectSSE, 2000);
            };
          } catch(e) {}
        }
        connectSSE();
        function ping() {
          fetch('/api/lifecycle/ping?tabId=' + encodeURIComponent(tabId), { method: 'POST' }).catch(function(){});
        }
        ping();
        setInterval(ping, 2500);
        function closeBeacon() {
          var url = '/api/lifecycle/close?tabId=' + encodeURIComponent(tabId);
          if (navigator.sendBeacon) {
            navigator.sendBeacon(url);
          } else {
            fetch(url, { method: 'POST', keepalive: true }).catch(function(){});
          }
        }
        window.addEventListener('beforeunload', closeBeacon);
        window.addEventListener('pagehide', closeBeacon);
      })();
    </script>
